name: Check pull request contents
on: pull_request

jobs:
  clang-format:
    name: Check conformance to the code format style
    runs-on: windows-2022
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Run clang-format
        uses: cpp-linter/cpp-linter-action@77c390c5ba9c947ebc185a3e49cc754f1558abb5  # v2.18.0
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          style: 'file'  # Use .clang-format config file
          version: '19'  # Match the formatter used for the project's style.
          # This is a formatting job, not a configured MSVC static-analysis job.
          # Running tidy without a compilation database misparses our SDK headers.
          tidy-checks: '-*'

      - name: Fail if clang reports any issues
        if: ${{ steps.linter.outputs.checks-failed > 0 }}
        run: |
          echo "clang-format found formatting issues; format the changed C/C++ files with clang-format 19."
          exit 1

  check-changelist-modified:
    name: Check that the changelog has been updated
    runs-on: windows-2022
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Check what files have been modified
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
        id: filter
        with:
          filters: |
            main:
              - 'src/main.cpp'

      - name: Fail if the changelog wasn't updated
        if: ${{ steps.filter.outputs.main == 'false' }}
        run: |
          echo "All user-visible changes must include an appropriate addition to the changelog"
          exit 1
